<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>井上様 - スケジュール表</title>
<meta property="og:title" content="井上様┃KOMAI HOME">
<meta property="og:description" content="お客様の工程・スケジュールをWebページで作成し共有しています✨ 是非ブックマークなどして確認用としてご覧ください🙇">
<meta property="og:image" content="https://eigyou3.github.io/Schedule/Ov2!gkr37eb1/ogp.png">
<meta property="og:url" content="https://eigyou3.github.io/Schedule/Ov2!gkr37eb1/Ov2!gkr37eb1.html">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="favicon.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f7f6f3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif}
.header{position:sticky;top:0;z-index:100;background:rgba(247,246,243,0.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:0.5px solid #e8e8e5;padding:10px 1rem}
.header-inner{max-width:460px;margin:0 auto;display:flex;align-items:center;gap:14px}
.header-title{font-size:14px;font-weight:500;color:#1a1a1a}
.header-sub{font-size:11px;color:#aaa;margin-top:1px}
.wrap{max-width:460px;margin:0 auto;padding:1.5rem 1rem 4rem}
.month-label{font-size:11px;font-weight:500;color:#aaa;letter-spacing:.08em;padding:1.5rem 0 8px}
.list{display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:stretch;border-radius:12px;overflow:hidden}
.row.past{opacity:0.3}
.date-block{width:64px;flex-shrink:0;padding:10px 12px;text-align:center;background:#f0efe9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.row.today .date-block{background:#ddeaf8}
.dn{font-size:18px;font-weight:500;color:#1a1a1a;line-height:1}
.dd{font-size:11px;color:#999;margin-top:1px}
.sun .dn,.sun .dd{color:#c0392b}
.sat .dn,.sat .dd{color:#2980b9}
.hol .dn,.hol .dd{color:#c0392b}
.today-dot{width:5px;height:5px;border-radius:50%;background:#378ADD;margin-top:3px}
.content-block{flex:1;padding:8px 14px;display:flex;align-items:center;min-height:44px;background:#fff;border-top:0.5px solid #e8e8e5;border-right:0.5px solid #e8e8e5;border-bottom:0.5px solid #e8e8e5;border-radius:0 12px 12px 0}
.row.today .content-block{border-color:#b5d4f4;border-left:2px solid #378ADD}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:400;white-space:nowrap}
.t-elec{background:#E6F1FB;color:#0C447C}
.t-water{background:#E1F5EE;color:#085041}
.t-heat{background:#FAEEDA;color:#633806}
.t-clean{background:#EAF3DE;color:#27500A}
.t-screen{background:#FAEEDA;color:#854F0B}
.t-foundation{background:#e8e0d5;color:#3d2b1f}
.t-carpenter{background:#f0e6d3;color:#5c3a1e}
.t-admin{background:#fef3c7;color:#78350f}
.tag-sub{font-size:10px;opacity:0.55;margin-left:4px;font-weight:400}
.t-inspect{background:#EEEDFE;color:#3C3489}
.t-exam{background:#FCEBEB;color:#791F1F}
.empty{font-size:12px;color:#bbb}
.note-block{margin-top:2rem;padding:14px 16px;border-radius:12px;border:0.5px solid #e8e8e5;background:#fff}
.note-row{font-size:12px;color:#666;line-height:1.8;display:flex;gap:8px;align-items:baseline}
.note-star{color:#E24B4A;flex-shrink:0}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div>
      <div class="header-title">井上様　工程表</div>
      <div class="header-sub">2026年5月〜6月</div>
    </div>
  </div>
</div>

<div class="wrap">
  <div id="list"></div>
  <div class="note-block">
    <div class="note-row"><span class="note-star">★</span><span>御見積の有効期限は<strong>１か月</strong>となっております</span></div>
  </div>
</div>

<script>
// ============================================================
// 工程データ
// 書き方：
//   単日        [月, 日]          例: [5, 7]
//   連続範囲    [月, 開始日, 終了日]  例: [5, 1, 15]  → 5/1〜15
//   混在OK      [[5,1,3],[5,7],[5,10,12]]
// ============================================================
const tasks=[
  {label:"お打ち合わせ",cls:"t-admin",entries:[["初回（はじめまして🙇‍♂️）",4,26],["図面打合せ",5,4],["図面打合せ",5,10],["完成見学",5,24],["図面打合せ",5,26],["見積提出予定日",6,14]]},
  {label:"土地現地調査",cls:"t-inspect",entries:[[5,11,15],["レポート提出",5,16]]},
  {label:"見積",cls:"t-exam",entries:[["準備期間-図面修正など",6,1],["依頼日",6,2],["業者見積期間",6,3,8],["業者見積締切日",6,9],["弊社積算",6,10,11],["積算完了日",6,12],["見積を確認してまとめます！",6,13]]},
  {label:"基礎工事",cls:"t-foundation",entries:[]},
  {label:"大工工事",cls:"t-carpenter",entries:[]},
  {label:"電気工事",cls:"t-elec",entries:[]},
  {label:"給排水・換気",cls:"t-water",entries:[]},
  {label:"暖房工事",cls:"t-heat",entries:[]},
  {label:"内装工事",cls:"t-inspect",entries:[]},
  {label:"ガス工事",cls:"t-admin",entries:[]},
  {label:"美装",cls:"t-clean",entries:[]},
  {label:"サッシ工事",cls:"t-screen",entries:[]},
  {label:"協力業者合同点検",cls:"t-admin",entries:[]},
  {label:"完了検査準備",cls:"t-inspect",entries:[]},
  {label:"完了検査",cls:"t-exam",entries:[]},
  {label:"お引渡し可能日程",cls:"t-admin",entries:[]},
];
// ============================================================

const months=[
  {year:2026, month:4, label:'4月', holidays:new Set([29])},
  {year:2026, month:5, label:'5月', holidays:new Set([3,4,5,6])},
  {year:2026, month:6, label:'6月', holidays:new Set()},
];

function expandEntries(entries){
  const result=[];
  entries.forEach(e=>{
    const hasSub=typeof e[0]==='string';
    const sub=hasSub?e[0]:null;
    const [m,s,end]=hasSub?e.slice(1):e;
    if(end===undefined) result.push({m,d:s,sub});
    else for(let d=s;d<=end;d++) result.push({m,d,sub});
  });
  return result;
}

const wd=['日','月','火','水','木','金','土'];
function dow(y,m,d){return new Date(y,m-1,d).getDay();}
function daysInMonth(y,m){return new Date(y,m,0).getDate();}

const now=new Date();
const todayY=now.getFullYear(),todayM=now.getMonth()+1,todayD=now.getDate();
function isToday(y,m,d){return y===todayY&&m===todayM&&d===todayD;}
function isPast(y,m,d){return new Date(y,m-1,d)<new Date(todayY,todayM-1,todayD);}

const evMap={};
tasks.forEach(t=>{
  expandEntries(t.entries).forEach(({m,d,sub})=>{
    const k=`${m}-${d}`;
    if(!evMap[k])evMap[k]=[];
    evMap[k].push({label:t.label,cls:t.cls,sub});
  });
});

let html='',scrollId=null;
months.forEach(({year,month,label,holidays})=>{
  html+=`<div class="month-label">${year}年${label}</div><div class="list">`;
  const total=daysInMonth(year,month);
  for(let d=1;d<=total;d++){
    const w=dow(year,month,d),hol=holidays.has(d);
    const evs=evMap[`${month}-${d}`]||[];
    const today=isToday(year,month,d),past=isPast(year,month,d);
    const dc=hol?'hol':w===0?'sun':w===6?'sat':'';
    const rc='row'+(past?' past':today?' today':'');
    const id=`d${year}-${month}-${d}`;
    if(today&&!scrollId)scrollId=id;
    html+=`<div class="${rc}" id="${id}">`;
    html+=`<div class="date-block ${dc}"><span class="dn">${d}</span><span class="dd">${wd[w]}</span>${today?'<span class="today-dot"></span>':''}</div>`;
    html+=`<div class="content-block"><div class="tags">`;
    if(evs.length)evs.forEach(e=>html+=`<span class="tag ${e.cls}">${e.label}${e.sub?`<span class="tag-sub">${e.sub}</span>`:''}</span>`);
    else html+=`<span class="empty">—</span>`;
    html+=`</div></div></div>`;
  }
  html+=`</div>`;
});
document.getElementById('list').innerHTML=html;
if(scrollId)setTimeout(()=>{
  const el=document.getElementById(scrollId);
  if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
},200);
</script>
</body>
</html>
